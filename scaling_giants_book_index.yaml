type: book
title: Scaling Giants
subtitle: Architecture Lessons from Tech's Most Demanding Systems
authors:
- Raghav Dinesh
updated: '2026-10-26'
version: 2.0.0-draft
status: rewrite in progress
language: en
standard: '2.0.0'
description: >-
  Architecture case studies of large-scale systems, each built on the papers, engineering posts and
  incident reports published by the companies that built them. Every chapter extracts the decisions
  and trade-offs a working engineer can reuse, and cites the source for every figure it gives.
tags:
- architecture
- distributed-systems
- scalability
- system-design

numbering:
  parts: upper-roman
  chapters: decimal
  sections: none
  figures: chapter.decimal
  tables: chapter.decimal
  equations: none
  code: none
  appendices: upper-alpha
labels:
  part: Part
  chapter: Chapter
  figure: Figure
  table: Table
  appendix: Appendix

# Chapters stay at visibility author until their file is written and every figure in it is checked
# against its source. A chapter then gains its file and is promoted to reader.
parts:
- title: Foundations
  id: part-foundations
  chapters:
  - title: Foundations of Scale
    id: ch-foundations-of-scale
    visibility: author

- title: Domain Architectures
  id: part-domain-architectures
  chapters:
  - title: 'Payments: Correctness Under Retries'
    id: ch-payments
    visibility: author
  - title: Storage and Durability
    id: ch-storage-durability
    visibility: author
  - title: Data Processing at Google
    id: ch-data-processing-google
    visibility: author
  - title: Sharded and Globally Distributed Databases
    id: ch-distributed-databases
    visibility: author
  - title: Social Graphs and Caching
    id: ch-social-graphs-caching
    visibility: author
  - title: Messaging and Event Streams
    id: ch-messaging-event-streams
    visibility: author
  - title: Geospatial Marketplaces
    id: ch-geospatial-marketplaces
    visibility: author
  - title: Content Delivery and the Edge
    id: ch-content-delivery-edge
    visibility: author
  - title: Real-Time Systems and Games
    id: ch-real-time-games
    visibility: author

- title: Operating at Scale
  id: part-operating-at-scale
  chapters:
  - title: Failure at Scale
    id: ch-failure-at-scale
    visibility: author
  - title: AI Training Infrastructure
    id: ch-ai-training-infrastructure
    visibility: author

- title: Synthesis
  id: part-synthesis
  chapters:
  - title: Patterns Across Domains
    id: ch-patterns-across-domains
    visibility: author

meta:
  licence:
    prose: CC BY-SA 4.0
    code: MIT
  sourcing_policy: >-
    Every figure cites a primary source: a paper, the company's own engineering post or incident report,
    official documentation, or a regulatory filing. A figure that cannot be traced to one is cut, not
    rounded or estimated. Secondary write-ups may point to a source but never replace it.
  verification: >-
    The sources below were listed from the author's tooling without network access. None has been
    checked against the live document yet. Each is confirmed (title, venue, year, URL) before its
    chapter is written; verified flips to true at that point.
  planned_front_matter:
  - Preface
  planned_appendices:
  - Glossary
  - Sources, one list per chapter
  dropped_from_v1:
  - topic: Pastebin, Tinder, gaming leaderboards, Redis beyond caching, scaling an app to ten million users
    reason: no primary source behind the architecture or figures given
  - topic: quantum computing, blockchain, IoT, edge AI, AI-driven auto-scaling, sustainability
    reason: speculative; not case studies of systems at scale
  - topic: appendices A-D (technology matrix, benchmarks table, tools list, glossary)
    reason: benchmarks table contradicted the chapters; glossary returns as a new appendix
  chapters:
    ch-foundations-of-scale:
      replaces: part-1-foundations/chapter-01-foundations-of-scale.md
      focus: what changes qualitatively at scale - tail latency, fan-out, failure as a constant
      sources:
      - Dean and Barroso, "The Tail at Scale", Communications of the ACM, 2013
      - Beyer, Jones, Petoff and Murphy (eds.), "Site Reliability Engineering", O'Reilly, 2016
      - Barroso, Hölzle and Ranganathan, "The Datacenter as a Computer", 3rd edition, 2018
      verified: false
    ch-payments:
      replaces: part-2-domain-architectures/chapter-02-financial-payment-systems.md
      focus: idempotency keys, safe retries, and migrating live payment data without downtime
      sources:
      - Stripe engineering blog, "Designing robust and predictable APIs with idempotency", 2017
      - Stripe engineering blog, "Online migrations at scale", 2017
      - PayPal Holdings annual report (Form 10-K), for payment transaction volume
      corrects: v1 stated PayPal processes 1 billion transactions a day; annual filings report roughly
        25 billion payment transactions a year
      verified: false
    ch-storage-durability:
      replaces: part-2-domain-architectures/chapter-07-cloud-infrastructure-storage.md
      focus: availability versus durability, quorum replication, and verifying a storage node
      sources:
      - DeCandia et al., "Dynamo - Amazon's Highly Available Key-value Store", SOSP 2007
      - Bornholt et al., "Using Lightweight Formal Methods to Validate a Key-Value Storage Node in Amazon
        S3", SOSP 2021
      - Amazon S3 User Guide, data durability
      corrects: v1 listed S3's eleven-nines durability design target as its uptime
      verified: false
    ch-data-processing-google:
      replaces: part-2-domain-architectures/chapter-03-search-discovery-at-scale.md
      focus: the file system, batch, storage and interactive-query layers behind web-scale search
      sources:
      - Ghemawat, Gobioff and Leung, "The Google File System", SOSP 2003
      - Dean and Ghemawat, "MapReduce - Simplified Data Processing on Large Clusters", OSDI 2004
      - Chang et al., "Bigtable - A Distributed Storage System for Structured Data", OSDI 2006
      - Melnik et al., "Dremel - Interactive Analysis of Web-Scale Datasets", VLDB 2010
      corrects: v1 gave Google Ads a 4.77 billion user figure with no source
      verified: false
    ch-distributed-databases:
      replaces: part-2-domain-architectures/chapter-05-content-media-delivery.md
      focus: sharding MySQL and Postgres under a live product, and external consistency across regions
      sources:
      - Vitess project documentation, history of Vitess at YouTube
      - Figma engineering blog, horizontal sharding of Postgres, 2024
      - Corbett et al., "Spanner - Google's Globally-Distributed Database", OSDI 2012
      corrects: v1 headings gave YouTube 2.49 billion and 49 billion users
      verified: false
    ch-social-graphs-caching:
      replaces: part-2-domain-architectures/chapter-04-social-communication-platforms.md
      focus: look-aside caching, cache invalidation, and a graph-shaped data store
      sources:
      - Nishtala et al., "Scaling Memcache at Facebook", NSDI 2013
      - Bronson et al., "TAO - Facebook's Distributed Data Store for the Social Graph", USENIX ATC 2013
      - Engineering at Meta, "Cache made consistent", 2022
      corrects: v1's cache-consistency percentage is to be checked against the Meta post
      verified: false
    ch-messaging-event-streams:
      replaces: part-2-domain-architectures/chapter-08-data-analytics-systems.md
      focus: connection density, message storage at trillions of rows, and the log as an integration layer
      sources:
      - Rick Reed, WhatsApp talks on scaling Erlang, Erlang Factory 2012 and 2014
      - Discord engineering blog, "How Discord Stores Trillions of Messages", 2023
      - Kreps, Narkhede and Rao, "Kafka - a Distributed Messaging System for Log Processing", NetDB 2011
      verified: false
    ch-geospatial-marketplaces:
      replaces: part-2-domain-architectures/chapter-03-search-discovery-at-scale.md
      focus: spatial indexing for dispatch, and a schemaless store built on MySQL
      sources:
      - Uber engineering blog, "H3 - Uber's Hexagonal Hierarchical Spatial Index", 2018
      - Uber engineering blog, Schemaless datastore series, 2016
      corrects: v1 stated Uber matches a million rides per second; Uber reports trips per day in its
        annual filings, in the tens of millions
      verified: false
    ch-content-delivery-edge:
      replaces: part-2-domain-architectures/chapter-07-cloud-infrastructure-storage.md
      focus: placing content inside ISP networks, and distributing configuration to every edge server
      sources:
      - Netflix Open Connect documentation
      - Cloudflare blog, "Introducing Quicksilver - Configuration Distribution at Internet Scale", 2020
      - Cloudflare's own published request-rate figures
      corrects: v1 gave Cloudflare both 55 million requests per second and 1 trillion requests per day,
        which contradict each other
      verified: false
    ch-real-time-games:
      replaces: part-2-domain-architectures/chapter-06-gaming-interactive-systems.md
      focus: server-authoritative netcode and tick rate, and a multi-day platform outage
      sources:
      - Riot Games technology blog, "Peeking into VALORANT's Netcode", 2020
      - Roblox blog, "Roblox Return to Service 10/28-10/31, 2021", 2022
      verified: false
    ch-failure-at-scale:
      replaces: none
      focus: designing for failure, and what three public post-incident reports teach
      sources:
      - Basiri et al., "Chaos Engineering", IEEE Software, 2016
      - AWS, summary of the December 2021 us-east-1 service event
      - Engineering at Meta, "More details about the October 4 outage", 2021
      verified: false
    ch-ai-training-infrastructure:
      replaces: part-3-next-generation/chapter-09-next-gen-computing.md
      focus: GPU cluster networks, parallelism strategies, and job reliability over weeks-long runs
      sources:
      - Engineering at Meta, "Building Meta's GenAI Infrastructure", 2024
      - Llama Team, "The Llama 3 Herd of Models", arXiv:2407.21783, 2024
      - Shoeybi et al., "Megatron-LM", arXiv:1909.08053, 2019
      verified: false
    ch-patterns-across-domains:
      replaces: synthesis/chapter-11-synthesis-and-future.md
      focus: the recurring patterns, each traced back to the chapters where it appears
      sources: []
      verified: false
